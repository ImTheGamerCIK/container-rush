    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { touch-action: manipulation; overscroll-behavior: none; }
        @keyframes bounce-slight { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }
        .animate-bounce-slight { animation: bounce-slight 2s infinite ease-in-out; }
        
        /* FOND BLUEPRINT POUR LE MENU */
        .bg-blueprint {
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%),
                linear-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.15) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* ANIMATIONS SUR-MESURE POUR LES HALOS LUMINEUX */
        .base-shadow { box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.3); }
        .selected-shadow { box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 15px rgba(250,204,21,0.8); }
        
        @keyframes pulse-halo-cyan {
            0%, 100% { outline-color: rgba(34, 211, 238, 0.3); box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 5px rgba(34, 211, 238, 0.2); }
            50% { outline-color: rgba(34, 211, 238, 1); box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 15px rgba(34, 211, 238, 0.8); }
        }
        .animate-halo-cyan { outline: 2px solid rgba(34, 211, 238, 1); outline-offset: 1px; animation: pulse-halo-cyan 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes pulse-halo-yellow {
            0%, 100% { outline-color: rgba(250, 204, 21, 0.3); box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 5px rgba(250, 204, 21, 0.2); }
            50% { outline-color: rgba(250, 204, 21, 1); box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 15px rgba(250, 204, 21, 0.8); }
        }
        .animate-halo-yellow { outline: 2px solid rgba(250, 204, 21, 1); outline-offset: 1px; animation: pulse-halo-yellow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>

        const TranstainerTrolley = ({ isActive, targetRow }) => {
            const baseCable = 20;
            const dropPerLevel = 52; 
            // Hauteur calculée pour s'arrêter sur le conteneur
            const dropY = isActive ? (150 - (targetRow * dropPerLevel)) : baseCable;

            return (
                <div className="absolute top-0 flex flex-col items-center z-50 transition-all duration-200 ease-out overflow-visible"
                     style={{ width: '60px', marginLeft: '-30px', transform: 'translateY(-4px)' }}>
                    
                    <svg viewBox="-40 0 80 200" className="overflow-visible w-full h-full drop-shadow-xl">
                        {/* Câbles (Descendent dynamiquement) */}
                        <line x1="-12" y1="20" x2="-12" y2={dropY} stroke="#94a3b8" strokeWidth="2" />
                        <line x1="12" y1="20" x2="12" y2={dropY} stroke="#94a3b8" strokeWidth="2" />
                        
                        {/* Chariot / Moteur (Harmonisé avec le Stacker) */}
                        <path d="M -25,0 L 25,0 L 30,20 L -30,20 Z" fill="#eab308" stroke="#0f172a" strokeWidth="2" strokeLinejoin="round" />
                        <rect x="-15" y="4" width="30" height="10" fill="#1e293b" stroke="#0f172a" strokeWidth="1.5" rx="2" />
                        <circle cx="-6" cy="9" r="2" fill="#38bdf8" />
                        <circle cx="6" cy="9" r="2" fill="#38bdf8" />

                        {/* SPREADER (Le Rack exact du Stacker copié-collé) */}
                        <g transform={`translate(0, ${dropY})`}>
                            <path d="M -8,-12 L 8,-12 L 8,0 L -8,0 Z" fill="#0f172a" />
                            <rect x="-26" y="0" width="52" height="8" fill="#eab308" stroke="#0f172a" strokeWidth="1" />
                            <path d="M -22,0 L -18,8 M -12,0 L -8,8 M -2,0 L 2,8 M 8,0 L 12,8 M 18,0 L 22,8" stroke="#0f172a" strokeWidth="2.5" />
                            <rect x="-25" y="8" width="4" height="12" fill="#1e293b" />
                            <rect x="21" y="8" width="4" height="12" fill="#1e293b" />
                        </g>
                    </svg>
                </div>
            );
        };

        // --- APPLICATION PRINCIPALE ---
        function App() {
          const [lang, setLang] = useState('fr');
          const t = (key) => i18n[lang][key] || key;

          const [G, setG] = useState(null); 
          const [user, setUser] = useState(null);

          const [roomId, setRoomId] = useState(null);
          const [joinCodeInput, setJoinCodeInput] = useState('');
          
          const [mySeat, setMySeat] = useState(0); 
          const [selected, setSelected] = useState(null);
          const [localMsg, setLocalMsg] = useState("");
          const [activePileIdx, setActivePileIdx] = useState(0);

          // Modales Multi

          const [showSoloRules, setShowSoloRules] = useState(false);
          const [showNewGameConfirm, setShowNewGameConfirm] = useState(false);
          const [showMenuConfirm, setShowMenuConfirm] = useState(false);
          const [showDevlog, setShowDevlog] = useState(false);

          // Leaderboard Solo
          const [leaderboardData, setLeaderboardData] = useState(null);
          const [showLeaderboard, setShowLeaderboard] = useState(false);
          const [playerNameInput, setPlayerNameInput] = useState('');
          const [qualifiesForLeaderboard, setQualifiesForLeaderboard] = useState(false);

          const [isAIEnabled, setIsAIEnabled] = useState(false);
          const [aiDifficulty, setAiDifficulty] = useState('moyen');

          const [tutorialState, setTutorialState] = useState(null); 
          const [tutorialSnapshots, setTutorialSnapshots] = useState({});

          const [showFeedback, setShowFeedback] = useState(false);
          const [feedbackText, setFeedbackText] = useState("");
          const [feedbackStatus, setFeedbackStatus] = useState(""); 

          const handleFeedbackSubmit = async () => {
              if (!feedbackText.trim()) return;
              setFeedbackStatus('sending');
              try {
                  const response = await fetch('https://formsubmit.co/ajax/charles@imthecikgamer.com', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',

                      body: JSON.stringify({
                          _subject: `Feedback Container Rush - ${lang.toUpperCase()}`,

                  if (response.ok) {
                      setFeedbackStatus('success');
                      setTimeout(() => { setShowFeedback(false); setFeedbackStatus(''); setFeedbackText(''); }, 2500);

                      setFeedbackStatus('error');
                  }
              } catch (error) {
                  setFeedbackStatus('error');
              }
          };

          useEffect(() => {
            if (!auth) { setIsAuthLoading(false); return; }
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } 
                    else { await signInAnonymously(auth); }

            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); setIsAuthLoading(false); });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
              if (!user || !roomId || !db || G?.gameMode === 'solo' || tutorialState) return; 
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
              const unsubscribe = onSnapshot(docRef, (snap) => {
                  if (snap.exists()) {

          }, [user, roomId, tutorialState, lang]);

          useEffect(() => {
              if (tutorialState && tutorialState.active && G) {
                  setTutorialSnapshots(prev => {
                      if (!prev[tutorialState.step]) {
                          return { ...prev, [tutorialState.step]: { G: JSON.parse(JSON.stringify(G)), activePileIdx, selected: selected ? JSON.parse(JSON.stringify(selected)) : null } };

          }, [tutorialState?.step, G, activePileIdx, selected]);

          const fetchLeaderboard = async (levelId) => {
              if (!db || !user) return [];
              try {
                  const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leaderboards', `level_${levelId}`));

          };

          const openLeaderboard = async (levelId) => {
              setLocalMsg("...");

          const submitSoloScore = async () => {

                  const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboards', `level_${G.levelId}`);
                  const snap = await getDoc(docRef);
                  let scores = snap.exists() ? snap.data().topScores || [] : [];
                  scores.push({ name, pg: G.pgUsed, time: Date.now() });
                  scores.sort((a, b) => { if (a.pg !== b.pg) return a.pg - b.pg; return a.time - b.time; });
                  scores = scores.slice(0, 10);
                  await setDoc(docRef, { topScores: scores });

          const checkLeaderboardQualification = async (finalPgUsed, levelId) => {

          const copyRoomCode = (e) => {

              document.body.removeChild(textArea);

          };

          const createRoom = async () => {

                  setMySeat(0); setIsAIEnabled(false); setRoomId(code); setLocalMsg(""); setActivePileIdx(0); setTutorialState(null);
              } catch (e) {}
          };

          const joinExistingRoom = async () => {

                  const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code));
                  if (snap.exists()) {
                      setMySeat(1); setIsAIEnabled(false); setRoomId(code); setLocalMsg(""); setActivePileIdx(0); setTutorialState(null);
                  } else setLocalMsg(t('room_not_found'));
              } catch (e) {}
          };

          const startLocalGame = (withAI) => { setRoomId(null); setG(createInitialState('multi')); setMySeat(0); setActivePileIdx(0); setIsAIEnabled(withAI); setTutorialState(null); setLobbyMode('game'); };
          
          const startSoloGame = (levelId) => {
              let diff = 'facile';
              if (levelId > 25 && levelId <= 50) diff = 'moyen';
              if (levelId > 50) diff = 'difficile';

              const initialState = createInitialState('solo', levelId * 100, diff); 
              initialState.gameMode = 'solo'; initialState.levelId = levelId; initialState.pgUsed = 0; initialState.message = `${t('level')} ${levelId} - Go!`;
              setRoomId(null); setG(initialState); setMySeat(0); setActivePileIdx(0); setIsAIEnabled(false); setLobbyMode('game'); setTutorialState(null);
          }

          const startInteractiveTutorial = () => {
              const tutState = createInitialState('multi', 1, 'moyen');
              tutState.ap = 4; tutState.message = t('t_title1');
              tutState.cranes[0].bayData = enrichLayout(MED_BAYS[0].layout); 
              tutState.cranes[0].deckData = enrichLayout(MED_DECKS[0].layout);
              tutState.cranes[0].name = "1"; tutState.cranes[0].phase = 'bay'; tutState.cranes[0].progress = 0;
              tutState.cour = generateInitialCour(1, 'moyen'); 
              tutState.cour[1][0] = ['M', 'L', 'H']; tutState.cour[3][2] = ['M', 'L', 'H']; tutState.cour[4][0] = ['M', 'H', 'L']; tutState.cour[5][0] = ['M', 'L']; tutState.cour[1][2] = ['H', 'M', 'L']; tutState.cour[1][3] = ['H', 'M'];      
              tutState.stackers[0] = 0; tutState.stackers[1] = 9; tutState.transtainer = 4; 
              setTutorialSnapshots({}); setG(tutState); setRoomId(null); setMySeat(0); setActivePileIdx(0); setIsAIEnabled(false);
              setTutorialState({ step: 0, active: true, minimized: false, mode: 'multi' }); setLobbyMode('game');
          };

          const startSoloTutorial = () => {
              const tutState = createInitialState('solo', 9999, 'facile');
              tutState.gameMode = 'solo';
              tutState.pgUsed = 0;
              tutState.message = t('t_solo_title1');
              
              tutState.cranes[0].bayData = enrichLayout(EASY_BAYS[0].layout); 
              tutState.cranes[0].deckData = enrichLayout(EASY_DECKS[0].layout);
              tutState.cranes[0].name = "1";
              tutState.cranes[0].phase = 'bay';
              tutState.cranes[0].progress = 0;

              tutState.cour = generateInitialCour(9999, 'facile'); 

              for(let p=0; p<10; p++) {
                  for(let c=0; c<4; c++) {
                      if(tutState.cour[p][c].length > 0) {
                          let topIdx = tutState.cour[p][c].length - 1;
                          if(tutState.cour[p][c][topIdx] === 'H') {
                              tutState.cour[p][c][topIdx] = 'M'; 
                          }
                      }
                  }
              }
              
              tutState.cour[1][0] = ['M', 'L', 'H']; 
              tutState.cour[1][1] = ['H', 'M'];      
              tutState.cour[1][2] = ['H', 'M', 'L']; 
              tutState.cour[1][3] = ['H', 'M'];      

              tutState.cour[8][0] = ['H', 'L']; 
              tutState.cour[9][0] = ['M']; 
              
              tutState.stackers[0] = 0; 
              tutState.stackers[1] = null; 
              tutState.transtainer = 4; 
              
              setTutorialSnapshots({}); setG(tutState); setRoomId(null); setMySeat(0); setActivePileIdx(0); setIsAIEnabled(false);
              setTutorialState({ step: 0, active: true, minimized: false, mode: 'solo' }); setLobbyMode('game');
          };

          const processTutorialAction = (actionType, args) => {
              if (!tutorialState || !tutorialState.active) return true; 
              const currentSteps = getTutorialSteps(t, tutorialState.mode);
              const stepData = currentSteps[tutorialState.step];
              if (stepData && stepData.type !== 'action') return false; 
              if (stepData && stepData.actionType === actionType) {
                  let match = true; for(let i=0; i<args.length; i++) { if (args[i] !== stepData.args[i]) match = false; }
                  if (match) { setTimeout(() => setTutorialState(prev => ({...prev, step: prev.step + 1})), 100); return true; }
              }
              setLocalMsg("❌ Action incorrecte."); setTimeout(() => setLocalMsg(""), 2500);
              return false;
          };

          const previousTutorialStep = () => {
              if (tutorialState && tutorialState.step > 0) {
                  const prevStep = tutorialState.step - 1;
                  const snap = tutorialSnapshots[prevStep];
                  if (snap) {
                      setG(JSON.parse(JSON.stringify(snap.G)));
                      setActivePileIdx(snap.activePileIdx);
                      setSelected(snap.selected ? JSON.parse(JSON.stringify(snap.selected)) : null);
                      setTutorialState(prev => ({...prev, step: prevStep}));
                      setLocalMsg(t('step_rewind'));
                      setTimeout(() => setLocalMsg(""), 2500);
                  }
              }
          };

          const resetTutorialSelection = () => {
              if (tutorialState && tutorialSnapshots[tutorialState.step]) {
                  const snap = tutorialSnapshots[tutorialState.step];
                  setG(snap.G); setActivePileIdx(snap.activePileIdx); setSelected(snap.selected);
              }
          };

          const getTutoClass = (targetId, currentPileIdx = null) => {
              if (tutorialState && tutorialState.active) {
                  const currentSteps = getTutorialSteps(t, tutorialState.mode);
                  const stepData = currentSteps[tutorialState.step];
                  if (stepData && stepData.type === 'action' && stepData.target === targetId) {
                      if (stepData.targetPile !== undefined && stepData.targetPile !== currentPileIdx) return ''; 
                      return ' ring-4 ring-emerald-400 ring-offset-2 ring-offset-slate-900 animate-pulse z-[60] relative pointer-events-auto ';
                  }
              }
              return '';
          };

          const createInitialState = (mode = 'multi', seed = null, difficulty = 'moyen') => ({ gameMode: mode, cour: generateInitialCour(seed, difficulty), cranes: getRandomCranes(seed, difficulty), players: [{ id: 1, score: 0 }, { id: 2, score: 0 }], transtainer: 4, stackers: [null, null], currentPlayer: 0, ap: 4, pgUsed: 0, gameStatus: 'playing', message: t('your_turn'), history: [] });
          const returnToMenu = () => { setG(null); setRoomId(null); setMySeat(0); setLocalMsg(""); setLobbyMode('menu'); setTutorialState(null); };
          const handleRestartGame = async () => {
              if (!canInteract || tutorialState) return;
              if (G.gameMode === 'solo') { startSoloGame(G.levelId); return; }
              const newState = createInitialState('multi');
              if (roomId && db && user) { try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { payload: JSON.stringify(newState) }); } catch(e){} } else setG(newState);
              setSelected(null); setActivePileIdx(0);
          };

          const mutateG = async (mutatorFn) => {
              if (!G) return;
              const newG = JSON.parse(JSON.stringify(G)); const historySnapshot = JSON.parse(JSON.stringify(G)); delete historySnapshot.history;
              newG.history = newG.history || []; newG.history.push(historySnapshot); if (newG.history.length > 50) newG.history.shift(); 
              mutatorFn(newG); setG(newG);
              if (roomId && db && user && newG.gameMode !== 'solo' && !tutorialState) { try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { payload: JSON.stringify(newG) }); } catch(e){} }
          };

          const isMyTurn = G?.gameMode === 'solo' || G?.currentPlayer === mySeat || tutorialState !== null;
          const canInteract = G?.gameStatus === 'playing' && (!roomId || isMyTurn);
          const getFirstAvailCol = (pile) => { for(let c=0; c<4; c++) if(pile[c].length > 0) return c; return -1; };
          const getFirstNonFullCol = (pile) => { for(let c=0; c<4; c++) if(pile[c].length < 3) return c; return -1; };
          const getCurrentRequirement = (crane) => {
            if (crane.phase === 'done') return null;
            const data = crane.phase === 'bay' ? crane.bayData : crane.deckData;
            for (let r = 0; r < data.enriched.length; r++) { for (let c = 0; c < data.enriched[r].length; c++) { const cell = data.enriched[r][c]; if (cell && cell.linearIndex === crane.progress) return cell.type; } } return null;
          };

          const executeAITurn = () => {
            if (!G || G.gameMode === 'solo' || tutorialState) return;
            let requirements = []; G.cranes.forEach((crane, idx) => { if (crane.phase !== 'done') requirements.push({ blockId: getCurrentRequirement(crane), craneIdx: idx }); });
            let candidates = [];
            for (let p = 0; p < 10; p++) {
                for (let c = 0; c < 4; c++) {
                    if (G.cour[p][c].length > 0) {
                        let topBlock = G.cour[p][c][G.cour[p][c].length - 1]; let matchingTarget = requirements.find(req => req.blockId === topBlock);
                        if (matchingTarget) {
                            if (getFirstAvailCol(G.cour[p]) === c) {
                                let isBlocked = Math.abs(p - G.transtainer) <= 1; let moveCost = (G.stackers[1] === p) ? 0 : (G.stackers[1] === null ? 0 : 1);
                                if (!isBlocked && (moveCost + 1 <= G.ap)) candidates.push({ type: 'POSE', machine: 'S', pIdx: p, cIdx: c, moveCost: moveCost, target: matchingTarget });
                            }
                            let tMoveCost = Math.abs(G.transtainer - p);
                            if (tMoveCost + 1 <= G.ap) candidates.push({ type: 'POSE', machine: 'T', pIdx: p, cIdx: c, moveCost: tMoveCost, target: matchingTarget });
                        }
                    }
                }
            }
            if (candidates.length > 0) {
                if (aiDifficulty === 'facile') candidates.sort(() => 0.5 - Math.random());
                else if (aiDifficulty === 'difficile') candidates.sort((a, b) => { let aBump = (a.machine === 'S' && G.stackers[0] === a.pIdx) || (a.machine === 'T' && G.stackers[0] !== null && Math.abs(G.stackers[0] - a.pIdx) <= 1) ? 1 : 0; let bBump = (b.machine === 'S' && G.stackers[0] === b.pIdx) || (b.machine === 'T' && G.stackers[0] !== null && Math.abs(G.stackers[0] - b.pIdx) <= 1) ? 1 : 0; if (aBump !== bBump) return bBump - aBump; return a.moveCost - b.moveCost; });
                else candidates.sort((a, b) => a.moveCost - b.moveCost);
                applyAIPose(candidates[0]); return;
            }
            let shiftCandidates = [];
            for (let p = 0; p < 10; p++) {
                for (let c = 0; c < 4; c++) {
                    if (G.cour[p][c].length > 1) {
                        let buriedBlock = G.cour[p][c][G.cour[p][c].length - 2]; let matchingTarget = requirements.find(req => req.blockId === buriedBlock);
                        if (matchingTarget) {
                            if (getFirstAvailCol(G.cour[p]) === c && Math.abs(p - G.transtainer) > 1) {
                                let moveCost = (G.stackers[1] === p) ? 0 : (G.stackers[1] === null ? 0 : 1);
                                let adjPiles = []; if (p > 0 && getFirstNonFullCol(G.cour[p-1]) !== -1) adjPiles.push(p-1); if (p < 9 && getFirstNonFullCol(G.cour[p+1]) !== -1) adjPiles.push(p+1);
                                if (adjPiles.length > 0 && (moveCost + 1 <= G.ap)) shiftCandidates.push({ type: 'SHIFT', machine: 'S', pIdx: p, cIdx: c, targetPIdx: adjPiles[0], moveCost: moveCost });
                            }
                            let tMoveCost = Math.abs(G.transtainer - p); let targetCIdx = -1;
                            for(let tc=0; tc<4; tc++) { if (tc !== c && G.cour[p][tc].length < 3) targetCIdx = tc; }
                            if (targetCIdx !== -1 && (tMoveCost + 1 <= G.ap)) shiftCandidates.push({ type: 'SHIFT', machine: 'T', pIdx: p, cIdx: c, targetCIdx: targetCIdx, moveCost: tMoveCost });
                        }
                    }
                }
            }
            if (shiftCandidates.length > 0) {
                if (aiDifficulty === 'facile' && Math.random() > 0.5) { applyAIShift(shiftCandidates[Math.floor(Math.random() * shiftCandidates.length)]); return; }
                else if (aiDifficulty !== 'facile') { shiftCandidates.sort((a, b) => a.moveCost - b.moveCost); applyAIShift(shiftCandidates[0]); return; }
            }
            if (aiDifficulty === 'difficile' && G.ap >= 1 && G.stackers[0] !== null) { let tMoveCost = Math.abs(G.transtainer - G.stackers[0]); if (tMoveCost > 0 && tMoveCost <= G.ap) { applyAITMoveOnly(G.stackers[0], tMoveCost); return; } }
            if (aiDifficulty !== 'facile' && G.ap >= 2 && G.stackers[1] !== null) applyAISpello();
            else mutateG(draft => { draft.ap = 0; });
          };
          useEffect(() => { if (G && isAIEnabled && G.currentPlayer === 1 && G.gameStatus === 'playing' && G.gameMode !== 'solo' && !tutorialState) { const timer = setTimeout(() => { if (G.ap > 0) executeAITurn(); else endTurn(); }, 1200); return () => clearTimeout(timer); } }, [G, isAIEnabled, aiDifficulty, tutorialState]);

          const applyAIPose = (move) => {
              mutateG(draft => {
                  const blockId = draft.cour[move.pIdx][move.cIdx].pop(); let pointsEarned = BLOCK_TYPES[blockId].points;
                  const activeCrane = draft.cranes[move.target.craneIdx]; activeCrane.progress += 1;
                  let msg = ""; const currentTotal = activeCrane.phase === 'bay' ? activeCrane.bayData.total : activeCrane.deckData.total; let isGameOver = false;
                  if (activeCrane.progress === currentTotal) { if (activeCrane.phase === 'bay') { activeCrane.phase = 'deck'; activeCrane.progress = 0; pointsEarned += 5; msg = `🤖 ${t('msg_bay_ok')}`; } else { activeCrane.phase = 'done'; pointsEarned += 10; msg = `🤖 ${t('msg_deck_ok')}`; if (draft.cranes.filter(c => c.phase === 'done').length >= 2) isGameOver = true; } } 
                  else { msg = `🤖 ${t('msg_placed')}`; }
                  draft.players[1].score += pointsEarned;
                  if (move.machine === 'S') { draft.stackers[1] = move.pIdx; if (draft.stackers[0] === move.pIdx) { draft.stackers[0] = null; } } else { draft.transtainer = move.pIdx; if (draft.stackers[0] !== null && Math.abs(draft.stackers[0] - move.pIdx) <= 1) { draft.stackers[0] = null; } if (draft.stackers[1] !== null && Math.abs(draft.stackers[1] - move.pIdx) <= 1) { draft.stackers[1] = null; } }
                  draft.ap -= (move.moveCost + 1); draft.message = msg;
                  if (isGameOver) { draft.gameStatus = 'gameover'; const winner = draft.players[0].score > draft.players[1].score ? t('you_win') : "IA " + t('win'); draft.message = `${t('game_over')} ${winner} !`; }
              });
          };
          const applyAIShift = (move) => { mutateG(draft => { const blockId = draft.cour[move.pIdx][move.cIdx].pop(); if (move.machine === 'S') { draft.stackers[1] = move.pIdx; if (draft.stackers[0] === move.pIdx) { draft.stackers[0] = null; } const targetCol = getFirstNonFullCol(draft.cour[move.targetPIdx]); draft.cour[move.targetPIdx][targetCol].push(blockId); } else { draft.transtainer = move.pIdx; if (draft.stackers[0] !== null && Math.abs(draft.stackers[0] - move.pIdx) <= 1) { draft.stackers[0] = null; } if (draft.stackers[1] !== null && Math.abs(draft.stackers[1] - move.pIdx) <= 1) { draft.stackers[1] = null; } draft.cour[move.pIdx][move.targetCIdx].push(blockId); } draft.ap -= (move.moveCost + 1); draft.message = `🤖 ${t('msg_shift_ok')}`; }); };
          const applyAISpello = () => { mutateG(draft => { draft.stackers[1] = null; draft.ap = 0; draft.message = `🤖 Spello`; }); };
          const applyAITMoveOnly = (pIdx, cost) => { mutateG(draft => { draft.transtainer = pIdx; draft.ap -= cost; draft.stackers[0] = null; if (draft.stackers[1] !== null && Math.abs(draft.stackers[1] - pIdx) <= 1) { draft.stackers[1] = null; } draft.message = `🤖 Spello`; }); };

          const handlePileNavigatorClick = (pIdx) => {

              if (selected?.type === 'machine') { handleMachineMove(pIdx); setActivePileIdx(pIdx); return; }
              if (selected?.type === 'block' && selected.machine === 'S') { if (Math.abs(pIdx - selected.pile) === 1) { handleShiftDestination(pIdx, null); return; } else { setActivePileIdx(pIdx); return; } }
              if (selected?.type === 'block' && selected.machine === 'T') { if (pIdx !== selected.pile) { } setActivePileIdx(pIdx); return; }
              if (tutorialState && tutorialState.active && selected === null) { return; }

              if (selected.id === 'T') {

                  if (dist === 0) { setSelected(null); return; }
                  if (G.gameMode !== 'solo' && G.ap < dist) { setLocalMsg(t('msg_err_pg')); return; }
                  mutateG(draft => { if (draft.gameMode === 'solo') draft.pgUsed += dist; else draft.ap -= dist; draft.transtainer = targetPileIdx; let bumped = false; if (draft.stackers[0] !== null && Math.abs(draft.stackers[0] - targetPileIdx) <= 1) { draft.stackers[0] = null; bumped = true; } if (draft.stackers[1] !== null && Math.abs(draft.stackers[1] - targetPileIdx) <= 1) { draft.stackers[1] = null; bumped = true; } draft.message = `🟡 T P${targetPileIdx+1} (${draft.gameMode==='solo'?'+':'-'}${dist} Moves). ${bumped ? 'Spello!' : ''}`; });
                  setSelected(null); setLocalMsg("");
              } else {
                  const targetStacker = selected.id; 
                  if (G.stackers[targetStacker] === targetPileIdx) { setSelected(null); return; }

                  const cost = G.stackers[targetStacker] === null ? 0 : 1;

                  mutateG(draft => { if (draft.gameMode === 'solo') draft.pgUsed += cost; else draft.ap -= cost; draft.stackers[targetStacker] = targetPileIdx; const enemy = targetStacker === 0 ? 1 : 0; let bumped = false; if (draft.stackers[enemy] === targetPileIdx) { draft.stackers[enemy] = null; bumped = true; } draft.message = `🔵 S P${targetPileIdx+1} (${draft.gameMode==='solo'?'+':'-'}${cost} Moves). ${bumped ? 'Spello!' : ''}`; });
